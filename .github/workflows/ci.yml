name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Build C++ daemon with warnings as errors
        run: make -C cpp CXXFLAGS="-std=c++11 -Wall -Wextra -Werror -O2 -pthread"

      # The Python/C++ parity tests skip themselves when g++ or Linux is
      # missing. That's right on a laptop but would hide a broken setup
      # here, so any skip fails the job.
      - name: Run pytest (no skips allowed)
        run: |
          python -m pytest -ra | tee pytest.log
          if grep -qi "skipped" pytest.log; then
            echo "::error::Tests were skipped on CI; the C++ parity tests must run here."
            exit 1
          fi

  live-test:
    name: Live Mininet test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t zone-seg-live docker/

      - name: Run live test
        run: docker run --rm --privileged -v "$PWD:/src:ro" zone-seg-live
